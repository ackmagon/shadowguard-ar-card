<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SHADOWGUARD | 3D Shield Zero Trust AI DLP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    #ar-container { position: fixed; inset: 0; width: 100%; height: 100%; }

    /* 상단 브랜드 헤더 HUD */
    #hud-top {
      position: fixed; top: 16px; left: 16px; right: 16px; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-radius: 12px;
      background: rgba(10, 18, 34, 0.84); backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.35); color: #f8fafc;
    }
    #hud-top .brand { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; color: #38bdf8; }
    #hud-top .slogan { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    #status-badge {
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
      background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.4);
    }
    #status-badge.active {
      background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(52, 211, 153, 0.5);
    }
    #status-badge.pinned {
      background: rgba(56, 189, 248, 0.25); color: #38bdf8; border-color: rgba(56, 189, 248, 0.6);
    }

    /* 중앙 가이드 스캔 프레임 */
    #scan-guide {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 82vw; max-width: 360px; aspect-ratio: 1.75 / 1;
      border: 2px dashed rgba(56, 189, 248, 0.65); border-radius: 14px;
      pointer-events: none; z-index: 15; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 12px; color: #e2e8f0; font-size: 12px; text-shadow: 0 1px 4px #000;
    }

    /* 범례 배지 */
    #legend {
      position: fixed; bottom: 82px; left: 16px; right: 16px; z-index: 20;
      display: flex; justify-content: center; gap: 14px;
      font-size: 11px; color: #e2e8f0; text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      pointer-events: none;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

    /* 하단 액션 버튼 HUD */
    #hud-bottom {
      position: fixed; bottom: 20px; left: 16px; right: 16px; z-index: 20;
      display: flex; gap: 10px;
    }
    .btn {
      flex: 1; padding: 14px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
      text-align: center; text-decoration: none; cursor: pointer; border: none;
    }
    .btn-primary { background: #0284c7; color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45); }
    .btn-secondary { background: rgba(15, 23, 42, 0.88); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.35); }
  </style>

  <!-- 카카오톡 인앱 브라우저 자동 탈출 스크립트 -->
  <script>
    (function() {
      const ua = navigator.userAgent.toLowerCase();
      const targetUrl = window.location.href;
      if (ua.includes('kakaotalk')) {
        window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
      }
    })();
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>

  <div id="hud-top">
    <div>
      <div class="brand">SHADOWGUARD</div>
      <div class="slogan">Safe Beyond the Shadow · AI 전용 DLP</div>
    </div>
    <div id="status-badge">명함을 비춰주세요</div>
  </div>

  <div id="scan-guide">명함 로고를 한 번 비추면 화면에 고정됩니다</div>

  <div id="ar-container"></div>

  <div id="legend">
    <span><i class="dot" style="background:#ef4444;"></i>민감정보 프롬프트 (차단)</span>
    <span><i class="dot" style="background:#10b981;"></i>정제 데이터 (안전 통과)</span>
  </div>

  <div id="hud-bottom">
    <button class="btn btn-secondary" id="reset-btn">다시 스캔하기</button>
    <a class="btn btn-primary" href="https://www.shadowguard.co.kr" target="_blank">솔루션 상세 / 도입문의</a>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    // 1. MindAR 초기화
    const mindarThree = new MindARThree({
      container: document.querySelector('#ar-container'),
      imageTargetSrc: './targets.mind',
      filterMinCF: 0.0001,
      filterBeta: 0.001,
      missTolerance: 8,
      warmupTolerance: 4, // 초기 불안정 프레임 건너뜀
      uiScanning: 'no',
      uiLoading: 'no'
    });

    const { renderer, scene, camera } = mindarThree;

    // 3D 조명 세팅
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x7dd3fc, 2.8);
    keyLight.position.set(2, 3, 4);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
    rimLight.position.set(-2, -2, 2);
    scene.add(rimLight);

    const anchor = mindarThree.addAnchor(0);
    const statusBadge = document.getElementById('status-badge');
    const scanGuide = document.getElementById('scan-guide');

    const smoothGroup = new THREE.Group();
    smoothGroup.visible = false;
    scene.add(smoothGroup);

    let isTargetVisible = false;
    let hasEverDetected = false;
    let firstFound = true;

    // 화면 고정 모드 전용 고정 깊이 (카메라 클리핑 방지 및 일관된 크기 보장)
    const PINNED_DEPTH_Z = -600;

    // 2. 3D 입체 방패(Shield) 오브젝트 생성 (쉐도우가드 2줄 방패 로고 + 코어 글로우 + 다중 홀로그램 링)
    function createShieldPath(scale = 1.0) {
      const s = scale;
      const path = new THREE.Shape();
      // 상단 중앙 정점에서 좌우 어깨로 이어지는 방패 크레스트 곡선
      path.moveTo(0, 0.38 * s);
      path.quadraticCurveTo(0.14 * s, 0.35 * s, 0.29 * s, 0.26 * s);
      // 우측 날개에서 하단 첨두로 수렴하는 곡선
      path.bezierCurveTo(0.30 * s, 0.02 * s, 0.21 * s, -0.22 * s, 0, -0.39 * s);
      // 하단 첨두에서 좌측 날개로 이어지는 대칭 곡선
      path.bezierCurveTo(-0.21 * s, -0.22 * s, -0.30 * s, 0.02 * s, -0.29 * s, 0.26 * s);
      path.quadraticCurveTo(-0.14 * s, 0.35 * s, 0, 0.38 * s);
      path.closePath();
      return path;
    }

    function createHoloRingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const cx = 256, cy = 256;

      // 외곽 대시 아크
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.78)';
      ctx.lineWidth = 5;
      ctx.setLineDash([28, 14, 8, 14]);
      ctx.beginPath();
      ctx.arc(cx, cy, 232, 0, Math.PI * 2);
      ctx.stroke();

      // 내측 얇은 가이드 링
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.38)';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 20]);
      ctx.beginPath();
      ctx.arc(cx, cy, 210, 0, Math.PI * 2);
      ctx.stroke();

      // 4방위 포인터 마커
      ctx.setLineDash([]);
      ctx.fillStyle = '#38bdf8';
      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2;
        const x = cx + Math.cos(angle) * 232;
        const y = cy + Math.sin(angle) * 232;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createCoreGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 8, 128, 128, 120);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.75)');
      grad.addColorStop(0.45, 'rgba(2, 132, 199, 0.28)');
      grad.addColorStop(1, 'rgba(2, 132, 199, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    function createShield3D() {
      const shieldGroup = new THREE.Group();

      // (A) 딥 아머 베이스 플레이트 (2줄 방패 사이의 어두운 그림자 깊이감 형성)
      const baseShape = createShieldPath(0.96);
      const baseGeo = new THREE.ExtrudeGeometry(baseShape, {
        depth: 0.042,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.01,
        bevelThickness: 0.01
      });
      baseGeo.center();
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0x061326,
        metalness: 0.88,
        roughness: 0.24,
        emissive: 0x082f49,
        emissiveIntensity: 0.25
      });
      shieldGroup.add(new THREE.Mesh(baseGeo, baseMat));

      // (B) 쉐도우가드 1선 (외곽 방패 라인 - 중공 입체 림 구조)
      const outerBandShape = createShieldPath(1.0);
      outerBandShape.holes.push(createShieldPath(0.81));
      const outerBandGeo = new THREE.ExtrudeGeometry(outerBandShape, {
        depth: 0.068,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.014,
        bevelThickness: 0.016
      });
      outerBandGeo.center();
      const outerBandMat = new THREE.MeshStandardMaterial({
        color: 0x0c4a6e,
        metalness: 0.82,
        roughness: 0.18,
        emissive: 0x0284c7,
        emissiveIntensity: 0.45
      });
      const outerBandMesh = new THREE.Mesh(outerBandGeo, outerBandMat);
      shieldGroup.add(outerBandMesh);

      // 외곽 1선 네온 엣지 하이라이트
      const outerEdges = new THREE.EdgesGeometry(outerBandGeo, 24);
      const outerEdgeMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.92
      });
      shieldGroup.add(new THREE.LineSegments(outerEdges, outerEdgeMat));

      // (C) 쉐도우가드 2선 (내측 방패 라인 - 전면/후면으로 한 단계 더 돌출된 2중 입체 구조)
      const innerBandShape = createShieldPath(0.67);
      innerBandShape.holes.push(createShieldPath(0.47));
      const innerBandGeo = new THREE.ExtrudeGeometry(innerBandShape, {
        depth: 0.092,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.012,
        bevelThickness: 0.015
      });
      innerBandGeo.center();
      const innerBandMat = new THREE.MeshStandardMaterial({
        color: 0x0284c7,
        metalness: 0.72,
        roughness: 0.15,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.58
      });
      const innerBandMesh = new THREE.Mesh(innerBandGeo, innerBandMat);
      shieldGroup.add(innerBandMesh);

      const innerEdges = new THREE.EdgesGeometry(innerBandGeo, 24);
      const innerEdgeMat = new THREE.LineBasicMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.95
      });
      shieldGroup.add(new THREE.LineSegments(innerEdges, innerEdgeMat));

      // (D) 중앙 AI 보안 코어 크리스탈 (2선 방패 안쪽 중심부)
      const coreShape = createShieldPath(0.29);
      const coreGeo = new THREE.ExtrudeGeometry(coreShape, {
        depth: 0.11,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.012,
        bevelThickness: 0.018
      });
      coreGeo.center();
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        metalness: 0.55,
        roughness: 0.12,
        emissive: 0x7dd3fc,
        emissiveIntensity: 0.75
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);
      shieldGroup.add(coreMesh);

      // (E) 코어 에너지 글로우 후광 플레인
      const glowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.82, 0.82),
        new THREE.MeshBasicMaterial({
          map: createCoreGlowTexture(),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        })
      );
      glowPlane.position.set(0, 0, -0.01);
      shieldGroup.add(glowPlane);

      // (F) 외곽 사이버네틱 HUD 홀로그램 링
      const haloRing = new THREE.Mesh(
        new THREE.PlaneGeometry(0.96, 0.96),
        new THREE.MeshBasicMaterial({
          map: createHoloRingTexture(),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        })
      );
      shieldGroup.add(haloRing);

      // (G) 3차원 경사 회전 오비탈 토러스 링 (입체 회전감 극대화)
      const orbitalGeo = new THREE.TorusGeometry(0.42, 0.0045, 12, 96);
      const orbitalMat = new THREE.MeshBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.65
      });
      const orbitalRing = new THREE.Mesh(orbitalGeo, orbitalMat);
      orbitalRing.rotation.x = Math.PI * 0.22;
      orbitalRing.rotation.y = -Math.PI * 0.15;
      shieldGroup.add(orbitalRing);

      return {
        shieldGroup,
        haloRing,
        orbitalRing,
        coreMesh,
        innerBandMat,
        outerBandMat,
        glowPlane
      };
    }

    function createMiniBadge(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 96;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(10, 18, 34, 0.9)';
      ctx.beginPath();
      ctx.roundRect(8, 8, 496, 80, 40);
      ctx.fill();

      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 34px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, 256, 60);

      const tex = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(
        new THREE.PlaneGeometry(0.78, 0.145),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
      );
    }

    // 3. 핵심 데모 그룹(rootGroup) 조립
    const rootGroup = new THREE.Group();
    const BASE_AR_SCALE = 2.6;
    rootGroup.scale.set(BASE_AR_SCALE, BASE_AR_SCALE, BASE_AR_SCALE);
    smoothGroup.add(rootGroup);

    const {
      shieldGroup,
      haloRing,
      orbitalRing,
      coreMesh,
      innerBandMat,
      outerBandMat,
      glowPlane
    } = createShield3D();
    shieldGroup.position.set(0, 0, 0.12);
    rootGroup.add(shieldGroup);

    const llmBadge = createMiniBadge('External AI (LLM)', '#34d399');
    llmBadge.position.set(0, 0.56, 0.08);
    rootGroup.add(llmBadge);

    const agentBadge = createMiniBadge('Enterprise / SG-Agent', '#94a3b8');
    agentBadge.position.set(0, -0.56, 0.08);
    rootGroup.add(agentBadge);

    const shockGeo = new THREE.RingGeometry(0.05, 0.09, 32);
    const shockMat = new THREE.MeshBasicMaterial({
      color: 0xf87171,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0
    });
    const shockwave = new THREE.Mesh(shockGeo, shockMat);
    shockwave.position.set(0, -0.05, 0.22);
    rootGroup.add(shockwave);
    let shockTimer = 0;

    // 4. 프롬프트 패킷 생성
    const packets = [];
    const sphereGeo = new THREE.SphereGeometry(0.032, 20, 20);

    for (let i = 0; i < 6; i++) {
      const isSensitive = i % 2 === 1;
      const mat = new THREE.MeshStandardMaterial({
        color: isSensitive ? 0xef4444 : 0x10b981,
        emissive: isSensitive ? 0xdc2626 : 0x059669,
        emissiveIntensity: 0.7
      });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.userData = {
        isSensitive,
        progress: i / 6,
        laneX: (i % 3 - 1) * 0.16,
        deflectDir: i % 4 === 1 ? 1 : -1
      };
      rootGroup.add(mesh);
      packets.push(mesh);
    }

    // 5. 스마트폰 화면 크기에 딱 맞는 최적 스케일 자동 계산
    function computeMobileFitScale(depthZ) {
      const distance = Math.abs(depthZ);
      const projM5 = camera.projectionMatrix.elements[5];
      // 카메라 투영 행렬 초기화 전 폴백 방지
      const fovRad = projM5 > 0 ? 2 * Math.atan(1 / projM5) : THREE.MathUtils.degToRad(45);
      const visibleHeight = 2 * distance * Math.tan(fovRad / 2);
      const visibleWidth = visibleHeight * (window.innerWidth / window.innerHeight);

      const objectHeight = 1.32 * BASE_AR_SCALE;
      const objectWidth = 0.95 * BASE_AR_SCALE;

      const scaleByH = (visibleHeight * 0.56) / objectHeight;
      const scaleByW = (visibleWidth * 0.78) / objectWidth;
      return Math.min(scaleByH, scaleByW);
    }

    // 즉시 화면 정중앙에 최적 크기로 스냅 정렬하는 헬퍼 함수
    function snapToMobileCenter() {
      const s = computeMobileFitScale(PINNED_DEPTH_Z);
      smoothGroup.position.set(0, 0, PINNED_DEPTH_Z);
      smoothGroup.scale.set(s, s, s);
      smoothGroup.rotation.set(userPitch, userYaw, 0, 'YXZ');
    }

    // 6. 타겟 인식 / 이탈 이벤트 핸들러
    anchor.onTargetFound = () => {
      isTargetVisible = true;
      hasEverDetected = true;
      smoothGroup.visible = true;

      if (firstFound) {
        anchor.group.updateMatrixWorld(true);
        const initPos = new THREE.Vector3().setFromMatrixPosition(anchor.group.matrixWorld);
        // 초기 프레임 거리값이 비정상적으로 가깝거나 0이면 안전 위치로 시작
        if (Math.abs(initPos.z) > 80) {
          smoothGroup.position.copy(initPos);
          smoothGroup.quaternion.setFromRotationMatrix(anchor.group.matrixWorld);
          smoothGroup.scale.setFromMatrixScale(anchor.group.matrixWorld);
        } else {
          snapToMobileCenter();
        }
        firstFound = false;
      }

      statusBadge.textContent = '명함 AR 트래킹 중';
      statusBadge.className = 'active';
      scanGuide.style.display = 'none';
    };

    anchor.onTargetLost = () => {
      isTargetVisible = false;
      if (hasEverDetected) {
        smoothGroup.visible = true;
        // 명함이 사라지는 즉시 거대 확대 현상 없이 모바일 정중앙 크기로 스냅 고정!
        snapToMobileCenter();
        statusBadge.textContent = '화면 고정 모드 (드래그 회전)';
        statusBadge.className = 'pinned';
      }
    };

    document.getElementById('reset-btn').addEventListener('click', () => {
      hasEverDetected = false;
      isTargetVisible = false;
      firstFound = true;
      smoothGroup.visible = false;
      userYaw = 0;
      userPitch = 0;
      statusBadge.textContent = '명함을 비춰주세요';
      statusBadge.className = '';
      scanGuide.style.display = 'flex';
    });

    // 7. 터치 드래그 자유 회전
    let isDragging = false;
    let prevTouchX = 0;
    let prevTouchY = 0;
    let userYaw = 0;
    let userPitch = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevTouchX = e.touches[0].clientX;
        prevTouchY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - prevTouchX;
      const dy = e.touches[0].clientY - prevTouchY;
      prevTouchX = e.touches[0].clientX;
      prevTouchY = e.touches[0].clientY;

      userYaw += dx * 0.008;
      userPitch = Math.max(-0.7, Math.min(0.7, userPitch + dy * 0.008));
    }, { passive: true });

    window.addEventListener('touchend', () => { isDragging = false; });

    const targetPos = new THREE.Vector3();
    const targetQuat = new THREE.Quaternion();
    const targetScale = new THREE.Vector3();
    const pinnedCenterPos = new THREE.Vector3();
    const pinnedQuat = new THREE.Quaternion();
    const pinnedEuler = new THREE.Euler();
    const fitScaleVec = new THREE.Vector3();

    // 8. 애니메이션 및 렌더링 루프
    const clock = new THREE.Clock();
    const start = async () => {
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();

        if (hasEverDetected) {
          const smoothFactor = Math.min(1, delta * 8.0);

          if (isTargetVisible) {
            // [모드 A] 명함 트래킹 중 (유효 거리 필터링 적용)
            anchor.group.updateMatrixWorld(true);
            targetPos.setFromMatrixPosition(anchor.group.matrixWorld);

            if (Math.abs(targetPos.z) > 80) {
              targetQuat.setFromRotationMatrix(anchor.group.matrixWorld);
              targetScale.setFromMatrixScale(anchor.group.matrixWorld);

              // 명함 트래킹 시에도 화면을 넘치지 않도록 최대 스케일 상한 제한
              const maxAllowedScale = computeMobileFitScale(targetPos.z) * 1.1;
              if (targetScale.x > maxAllowedScale) {
                targetScale.setScalar(maxAllowedScale);
              }

              smoothGroup.position.lerp(targetPos, smoothFactor);
              smoothGroup.quaternion.slerp(targetQuat, smoothFactor);
              smoothGroup.scale.lerp(targetScale, smoothFactor);
            }
          } else {
            // [모드 B] 화면 고정 모드: 고정 깊이(-600) 기준 모바일 정중앙 유지
            const s = computeMobileFitScale(PINNED_DEPTH_Z);
            fitScaleVec.set(s, s, s);
            pinnedCenterPos.set(0, 0, PINNED_DEPTH_Z);
            pinnedEuler.set(userPitch, userYaw, 0, 'YXZ');
            pinnedQuat.setFromEuler(pinnedEuler);

            smoothGroup.position.lerp(pinnedCenterPos, smoothFactor);
            smoothGroup.quaternion.slerp(pinnedQuat, smoothFactor);
            smoothGroup.scale.lerp(fitScaleVec, smoothFactor);
          }
        }

        // 3D 방패 회전, 코어 호흡 글로우 및 다중 홀로그램 링 모션
        shieldGroup.rotation.y += delta * 1.1;
        const impactBoost = Math.max(0, shockTimer);
        shieldGroup.position.z = 0.14 + Math.sin(clock.elapsedTime * 2.5) * 0.025 - impactBoost * 0.018;
        haloRing.rotation.z -= delta * 0.6;
        orbitalRing.rotation.z += delta * 1.4;
        orbitalRing.rotation.x = Math.PI * 0.22 + Math.sin(clock.elapsedTime * 1.8) * 0.12;

        const pulse = 0.5 + 0.5 * Math.sin(clock.elapsedTime * 3.5);
        coreMesh.scale.setScalar(0.96 + pulse * 0.07 + impactBoost * 0.12);
        glowPlane.scale.setScalar(0.95 + pulse * 0.1 + impactBoost * 0.22);
        innerBandMat.emissiveIntensity = 0.55 + pulse * 0.2 + impactBoost * 0.65;
        outerBandMat.emissiveIntensity = 0.42 + pulse * 0.12 + impactBoost * 0.45;

        // 충격파 확산
        if (shockTimer > 0) {
          shockTimer -= delta * 2.2;
          const s = 1 + (1 - shockTimer) * 4.5;
          shockwave.scale.set(s, s, 1);
          shockwave.material.opacity = Math.max(0, shockTimer * 0.85);
        }

        // 프롬프트 패킷 애니메이션
        packets.forEach((p) => {
          const prevT = p.userData.progress;
          p.userData.progress += delta * 0.45;
          if (p.userData.progress > 1) p.userData.progress = 0;

          const t = p.userData.progress;

          if (p.userData.isSensitive) {
            if (t < 0.5) {
              const p1 = t * 2;
              p.position.set(
                p.userData.laneX * (1 - p1 * 0.5),
                -0.48 + p1 * 0.44,
                0.15 + Math.sin(p1 * Math.PI) * 0.1
              );
              p.scale.setScalar(1);
            } else {
              if (prevT < 0.5) {
                shockTimer = 1.0;
                shockwave.position.set(p.userData.laneX * 0.5, -0.04, 0.24);
              }
              const p2 = (t - 0.5) * 2;
              p.position.set(
                p.userData.laneX * 0.5 + p.userData.deflectDir * p2 * 0.42,
                -0.04 - p2 * 0.22,
                0.22 + p2 * 0.18
              );
              p.scale.setScalar(Math.max(0, 1 - p2 * 1.3));
            }
          } else {
            const arcZ = 0.04 - Math.sin(t * Math.PI) * 0.08;
            p.position.set(
              p.userData.laneX * 1.4,
              -0.48 + t * 0.96,
              arcZ
            );
            p.scale.setScalar(1);
          }
        });

        renderer.render(scene, camera);
      });
    };

    start();
  </script>
</body>
