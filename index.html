<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SHADOWGUARD | Safe Beyond the Shadow - WebAR Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    #ar-container { position: fixed; inset: 0; width: 100%; height: 100%; }

    /* 상단 브랜드 헤더 HUD */
    #hud-top {
      position: fixed; top: 16px; left: 16px; right: 16px; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-radius: 12px;
      background: rgba(10, 18, 34, 0.78); backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.35); color: #f8fafc;
    }
    #hud-top .brand { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; color: #38bdf8; }
    #hud-top .slogan { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    #status-badge {
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
      background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.4);
    }
    #status-badge.active {
      background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(52, 211, 153, 0.5);
    }

    /* 중앙 가이드 스캔 프레임 */
    #scan-guide {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 78vw; max-width: 340px; aspect-ratio: 1.75 / 1;
      border: 2px dashed rgba(56, 189, 248, 0.65); border-radius: 14px;
      pointer-events: none; z-index: 15; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 12px; color: #e2e8f0; font-size: 12px; text-shadow: 0 1px 4px #000;
    }

    /* 하단 액션 버튼 HUD */
    #hud-bottom {
      position: fixed; bottom: 20px; left: 16px; right: 16px; z-index: 20;
      display: flex; gap: 10px;
    }
    .btn {
      flex: 1; padding: 13px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
      text-align: center; text-decoration: none; cursor: pointer; border: none;
    }
    .btn-primary { background: #0284c7; color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45); }
    .btn-secondary { background: rgba(15, 23, 42, 0.85); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.35); }
  </style>

  <!-- 카카오톡 인앱 브라우저 자동 탈출 스크립트 -->
  <script>
    (function() {
      const ua = navigator.userAgent.toLowerCase();
      const targetUrl = window.location.href;
      if (ua.includes('kakaotalk')) {
        window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
      }
    })();
  </script>

  <!-- Three.js & MindAR Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>

  <div id="hud-top">
    <div>
      <div class="brand">SHADOWGUARD</div>
      <div class="slogan">Safe Beyond the Shadow · AI 전용 DLP</div>
    </div>
    <div id="status-badge">명함을 비춰주세요</div>
  </div>

  <div id="scan-guide">명함 앞면 전체를 사각형 안에 맞춰주세요</div>

  <div id="ar-container"></div>

  <div id="hud-bottom">
    <button class="btn btn-secondary" id="toggle-mode-btn">시나리오 전환</button>
    <a class="btn btn-primary" href="https://shadowguard.co.kr" target="_blank">솔루션 상세 / 도입문의</a>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    // 1. MindAR 초기화 (실제 배포 시 명함 이미지로 컴파일한 './targets.mind' 경로로 교체)
    const mindarThree = new MindARThree({
      container: document.querySelector('#ar-container'),
      imageTargetSrc: './targets.mind',
      uiScanning: 'no',
      uiLoading: 'no'
    });

    const { renderer, scene, camera } = mindarThree;

    // 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
    dirLight.position.set(1, 2, 3);
    scene.add(dirLight);

    // 명함 앵커 생성
    const anchor = mindarThree.addAnchor(0);
    const statusBadge = document.getElementById('status-badge');
    const scanGuide = document.getElementById('scan-guide');

    anchor.onTargetFound = () => {
      statusBadge.textContent = 'SG-Gate 실시간 보안 감시 중';
      statusBadge.classList.add('active');
      scanGuide.style.display = 'none';
    };

    anchor.onTargetLost = () => {
      statusBadge.textContent = '명함을 비춰주세요';
      statusBadge.classList.remove('active');
      scanGuide.style.display = 'flex';
    };

    // 2. 텍스트 라벨 생성 유틸리티 (Canvas Texture)
    function createLabelPlane(title, subtitle, borderColor, bgColor, width = 0.85, height = 0.24) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 144;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, 512, 144);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, 504, 136);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 256, 62);

      ctx.fillStyle = borderColor;
      ctx.font = '24px sans-serif';
      ctx.fillText(subtitle, 256, 108);

      const tex = new THREE.CanvasTexture(canvas);
      const geo = new THREE.PlaneGeometry(width, height);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.94 });
      return new THREE.Mesh(geo, mat);
    }

    // 3. 3D 아키텍처 노드 구성 (명함 위 Z축 방향으로 입체 배치)
    const rootGroup = new THREE.Group();
    anchor.group.add(rootGroup);

    // [하단] 사내 임직원 / SG-Agent
    const agentNode = createLabelPlane('Enterprise / SG-Agent', 'AI 프롬프트 실시간 트래픽 발생', '#94a3b8', 'rgba(15, 23, 42, 0.9)');
    agentNode.position.set(0, -0.34, 0.08);
    rootGroup.add(agentNode);

    // [중앙] 쉐도우가드 SG-Gate (제로 트러스트 프록시 게이트웨이)
    const gateNode = createLabelPlane('SHADOWGUARD SG-Gate', 'Zero Trust DLP · 민감정보 탐지/차단', '#38bdf8', 'rgba(3, 105, 161, 0.92)', 0.96, 0.28);
    gateNode.position.set(0, 0, 0.22);
    rootGroup.add(gateNode);

    // SG-Gate 주변 3D 보안 링
    const ringGeo = new THREE.RingGeometry(0.46, 0.49, 48);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.65 });
    const shieldRing = new THREE.Mesh(ringGeo, ringMat);
    shieldRing.position.set(0, 0, 0.20);
    rootGroup.add(shieldRing);

    // [상단] 외부 생성형 AI (ChatGPT, Claude, Gemini 등)
    const llmNode = createLabelPlane('External Generative AI', '정제된 안전 프롬프트만 승인 전달', '#34d399', 'rgba(6, 78, 59, 0.9)');
    llmNode.position.set(0, 0.36, 0.12);
    rootGroup.add(llmNode);

    // 4. 데이터 패킷 애니메이션 (녹색: 정상 통과 / 적색: 민감정보 SG-Gate에서 차단)
    const packets = [];
    const sphereGeo = new THREE.SphereGeometry(0.024, 16, 16);

    for (let i = 0; i < 6; i++) {
      const isSensitive = i % 2 === 1; // 홀수 패킷은 기밀/개인정보(적색 차단)
      const mat = new THREE.MeshBasicMaterial({ color: isSensitive ? 0xef4444 : 0x10b981 });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.userData = {
        isSensitive,
        progress: i / 6,
        xOffset: (i % 3 - 1) * 0.18
      };
      rootGroup.add(mesh);
      packets.push(mesh);
    }

    // 시나리오 전환 버튼 (입체 각도 변경)
    let tilted = false;
    document.getElementById('toggle-mode-btn').addEventListener('click', () => {
      tilted = !tilted;
      rootGroup.rotation.x = tilted ? -0.45 : 0;
    });

    // 5. 렌더링 루프 실행
    const clock = new THREE.Clock();
    const start = async () => {
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        shieldRing.rotation.z += delta * 0.8;

        packets.forEach((p) => {
          p.userData.progress += delta * 0.45;
          if (p.userData.progress > 1) p.userData.progress = 0;

          const t = p.userData.progress;
          if (p.userData.isSensitive) {
            // 민감정보 패킷: 하단(-0.34)에서 출발해 중앙 SG-Gate(0)에서 차단 후 소멸
            const clampedT = Math.min(t * 2, 1);
            p.position.set(p.userData.xOffset, -0.34 + clampedT * 0.34, 0.15 + Math.sin(clampedT * Math.PI) * 0.12);
            p.scale.setScalar(t > 0.5 ? Math.max(0, 1 - (t - 0.5) * 4) : 1);
          } else {
            // 안전 패킷: 하단(-0.34) -> SG-Gate(0) 통과 -> 상단 AI(0.36) 도달
            p.position.set(p.userData.xOffset, -0.34 + t * 0.70, 0.15 + Math.sin(t * Math.PI) * 0.14);
            p.scale.setScalar(1);
          }
        });

        renderer.render(scene, camera);
      });
    };

    start();
  </script>
</body>
</html>
